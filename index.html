<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Na Na Na - Anyuri</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* Fondo azul noche/oscuro */
            background: #171723;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        /* --- IMÁGENES ROTADAS --- */
        .screenshot {
            position: absolute;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            pointer-events: none;
        }

        /* Imagen 1 (abajo a la izquierda) */
        .img-1 {
            width: 260px;
            bottom: 8%;
            left: 5%;
            transform: rotate(12deg);
            z-index: 2;
        }

        /* Imagen 2 (arriba a la izquierda) */
        .img-2 {
            width: 250px;
            top: 5%;
            left: 5%;
            transform: rotate(-10deg);
            z-index: 2;
        }

        /* Imagen 3 (arriba a la derecha) */
        .img-3 {
            width: 240px;
            top: 6%;
            right: 22%;
            transform: rotate(15deg);
            z-index: 2;
        }

        /* --- SPOTIFY PLAYER CARD --- */
        .player-card {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 20, 32, 0.90) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 290px;
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 9999;
        }

        .album-art-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
            background-color: #121019;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .track-info { flex-grow: 1; }
        .track-title { font-size: 20px; font-weight: 800; color: #ffffff; margin-bottom: 2px; letter-spacing: -0.5px; }
        .artist-name { font-size: 13px; color: rgba(255, 255, 255, 0.7); font-weight: 500; }
        .add-btn { background: none; border: none; color: rgba(255, 255, 255, 0.8); font-size: 20px; cursor: pointer; padding: 4px; }
        .status-msg { font-size: 10px; color: #ff6b6b; text-align: center; margin-bottom: 5px; min-height: 14px; }

        .controls-container { margin-top: 5px; margin-bottom: 15px; }
        .progress-bar-container { width: 100%; height: 4px; background-color: rgba(255, 255, 255, 0.15); border-radius: 2px; margin-bottom: 6px; position: relative; cursor: pointer; }
        .progress-bar { width: 0%; height: 100%; background-color: #e84188; border-radius: 2px; transition: width 0.1s linear; }
        .time-stamps { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255, 255, 255, 0.6); font-weight: 600; margin-bottom: 12px; }
        .playback-controls { display: flex; justify-content: center; align-items: center; gap: 18px; }
        .control-btn { background: none; border: none; color: #ffffff; font-size: 15px; cursor: pointer; opacity: 0.8; }
        
        .play-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background-color: #e84188; color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; cursor: pointer; border: none;
            box-shadow: 0 4px 12px rgba(232, 65, 136, 0.4);
        }

        .queue-divider { display: flex; align-items: center; text-align: center; margin: 15px 0 10px 0; color: rgba(255, 255, 255, 0.5); font-size: 11px; font-weight: 600; }
        .queue-divider::before, .queue-divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .queue-divider:not(:empty)::before { margin-right: .75em; }
        .queue-divider:not(:empty)::after { margin-left: .75em; }

        .queue-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .queue-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .item-info { display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; }
        .item-title { font-weight: 700; color: #ffffff; }
        .item-dot { color: rgba(255, 255, 255, 0.4); font-weight: bold; }
        .item-artist { color: rgba(255, 255, 255, 0.6); font-weight: 500; font-size: 11px; text-transform: uppercase; }
        .item-duration { color: rgba(255, 255, 255, 0.5); font-size: 11px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- Imágenes de fondo -->
    <img src="yourdadnga.jpeg" alt="Screenshot 1" class="screenshot img-1">
    <img src="tarded764.jpeg" alt="Screenshot 2" class="screenshot img-2">
    <img src="Shitty4c.jpeg" alt="Screenshot 3" class="screenshot img-3">

    <!-- Reproductor de Audio -->
    <div class="player-card">
        <div class="album-art-container">
            <img class="album-art" src="Anyuri%20nanana.jpg" alt="">
        </div>

        <div class="track-header">
            <div class="track-info">
                <div class="track-title">Na Na Na</div>
                <div class="artist-name">Anyuri</div>
            </div>
            <button class="add-btn"><i class="far fa-plus-square"></i></button>
        </div>

        <div class="status-msg" id="status-msg"></div>

        <div class="controls-container">
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-stamps">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="playback-controls">
                <button class="control-btn"><i class="fas fa-random"></i></button>
                <button class="control-btn"><i class="fas fa-step-backward"></i></button>
                
                <button class="play-btn" id="play-btn">
                    <i class="fas fa-play" id="play-icon" style="margin-left: 2px;"></i>
                </button>
                
                <button class="control-btn"><i class="fas fa-step-forward"></i></button>
                <button class="control-btn"><i class="fas fa-redo"></i></button>
            </div>
        </div>

        <div class="queue-divider">Queue</div>

        <ul class="queue-list">
            <li class="queue-item">
                <div class="item-info">
                    <span class="item-title">Se Descargo el Amor</span>
                    <span class="item-dot">•</span>
                    <span class="item-artist">BCA</span>
                </div>
                <span class="item-duration">3:13</span>
            </li>
            <li class="queue-item">
                <div class="item-info">
                    <span class="item-title">San José</span>
                    <span class="item-dot">•</span>
                    <span class="item-artist">BARBEL</span>
                </div>
                <span class="item-duration">3:56</span>
            </li>
            <li class="queue-item">
                <div class="item-info">
                    <span class="item-title">Enamorame</span>
                    <span class="item-dot">•</span>
                    <span class="item-artist">EL KID, RASTA LLOYD</span>
                </div>
                <span class="item-duration">3:53</span>
            </li>
            <li class="queue-item">
                <div class="item-info">
                    <span class="item-title">Mi Despecho</span>
                    <span class="item-dot">•</span>
                    <span class="item-artist">YEMIL</span>
                </div>
                <span class="item-duration">3:30</span>
            </li>
            <li class="queue-item">
                <div class="item-info">
                    <span class="item-title">Tu Chacal</span>
                    <span class="item-dot">•</span>
                    <span class="item-artist">SMILE BEATS, VALENTINO GRM</span>
                </div>
                <span class="item-duration">2:52</span>
            </li>
            <li class="queue-item">
                <div class="item-info">
                    <span class="item-title">Tu Man</span>
                    <span class="item-dot">•</span>
                    <span class="item-artist">JOSUAN, VALENTINO GRM</span>
                </div>
                <span class="item-duration">4:00</span>
            </li>
        </ul>
    </div>

    <audio id="audio" src="./Na%20Na%20Na.mp3" preload="auto" autoplay></audio>

    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const statusMsg = document.getElementById('status-msg');

        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function setPlayState() {
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
            playIcon.style.marginLeft = "0px";
            statusMsg.innerText = "";
        }

        function setPauseState() {
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            playIcon.style.marginLeft = "2px";
        }

        window.addEventListener('DOMContentLoaded', () => {
            audio.play().then(() => {
                setPlayState();
            }).catch(() => {
                const startOnFirstInteraction = () => {
                    audio.play().then(() => {
                        setPlayState();
                        document.removeEventListener('click', startOnFirstInteraction);
                    });
                };
                document.addEventListener('click', startOnFirstInteraction);
            });
        });

        audio.addEventListener('loadedmetadata', () => {
            if (audio.duration) {
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        audio.addEventListener('error', () => {
            statusMsg.innerText = "Error: No se encuentra 'Na Na Na.mp3'";
        });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play().then(() => {
                    setPlayState();
                }).catch(err => {
                    statusMsg.innerText = "Toca para reproducir";
                });
            } else {
                audio.pause();
                setPauseState();
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                currentTimeEl.innerText = formatTime(audio.currentTime);
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            if (audio.duration) {
                audio.currentTime = (clickX / width) * audio.duration;
            }
        });

        audio.addEventListener('ended', () => {
            setPauseState();
            progressBar.style.width = '0%';
            currentTimeEl.innerText = '0:00';
        });
    </script>
</body>
</html>
